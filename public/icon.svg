<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="44%" r="48%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#0C0C0E"/>

  <!-- Ambient orb -->
  <ellipse cx="256" cy="224" rx="228" ry="196" fill="url(#orb)"/>

  <!-- Thin ring -->
  <circle cx="256" cy="256" r="194" fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.2"/>

  <!-- Corner accents -->
  <path d="M88 88 L118 88 M88 88 L88 118" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M424 424 L394 424 M424 424 L424 394" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

  <!-- G -->
  <text x="256" y="336" font-family="system-ui,-apple-system,sans-serif" font-size="268" font-weight="900" text-anchor="middle" fill="url(#g)" filter="url(#glow)">G</text>
</svg>
